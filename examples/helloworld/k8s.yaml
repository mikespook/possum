apiVersion: apps/v1
kind: Deployment
metadata:
  name: possum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: possum
  template:
    metadata:
      labels:
        app: possum
    spec:
      containers:
        - name: possum
          image: mikespook/possum-helloworld:1.0.1
          ports:
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: possum
spec:
  type: NodePort
  selector:
    app: possum
  ports:
    - port: 9123
      targetPort: 9000
