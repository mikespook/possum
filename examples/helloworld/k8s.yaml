apiVersion: apps/v1
kind: Deployment
metadata:
  name: possum
spec:
  replicas: 1
  selector:
    matchLabels:
      app: possum
  template:
    metadata:
      labels:
        app: possum
    spec:
      containers:
        - name: possum
          image: mikespook/possum-helloworld:1.0.1
          ports:
            - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: possum
spec:
  type: ClusterIP
  selector:
    app: possum
  ports:
    - port: 9123
      targetPort: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: possum
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: possum
                port:
                  number: 9123
